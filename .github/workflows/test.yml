name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# bash with -eo pipefail in every step.
defaults:
  run:
    shell: bash

jobs:
  linux:
    # The latest LTS image. Ubuntu 24.04, ubuntu-latest in November 2026,
    # ships shellcheck 0.9.0, which reports two SC2015 notes in the scripts
    # that the 0.11.0 of this image does not.
    runs-on: ubuntu-26.04
    # The suite runs in under a minute; the rest is installs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - name: Log the Claude Code version
        run: claude --version
      - name: Validate the plugin
        run: claude plugin validate . --strict
      - name: Put the laterbox engine on PATH
        # test-run-archive is skipped when later is not on PATH. Pinned to
        # laterbox's main of 2026-11-10, one commit past v0.2.2, so a change
        # there cannot turn this job red unannounced. Move the pin to
        # laterbox's new main when laterbox tags a release or changes the
        # later command, in a commit whose run of this job passes.
        run: |
          commit=b9edd6bd7d63e7f431b208b29822a131ccb50f18
          git init -q "$RUNNER_TEMP/laterbox"
          git -C "$RUNNER_TEMP/laterbox" fetch -q --depth 1 https://github.com/akalongman/claude-laterbox "$commit"
          git -C "$RUNNER_TEMP/laterbox" checkout -q FETCH_HEAD
          echo "$RUNNER_TEMP/laterbox/scripts" >> "$GITHUB_PATH"
      - name: Install superpowers at the verified release
        # The suite checks the installed copy against the pin in
        # skills/apply/scripts/sub-skill-check, and claude plugin install takes
        # no version, so this writes the layout that script reads. The version
        # moves with that pin, in the same commit, and so does the commit: the
        # one tag v<version> of obra/superpowers peels to, fetched by hash
        # because a tag can move.
        run: |
          version=7.0.2
          commit=22f0b463e7a5e579904dd6211a520321035526f7
          dir="$HOME/.claude/plugins/cache/superpowers-marketplace/superpowers/$version"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/obra/superpowers "$commit"
          git -C "$dir" checkout -q FETCH_HEAD
          jq -n --arg p "$dir" --arg v "$version" '{"version": 2, "plugins": {"superpowers@superpowers-marketplace": [{"scope": "user", "installPath": $p, "version": $v}]}}' > "$HOME/.claude/plugins/installed_plugins.json"
      - name: Set a git identity
        # The suite commits in throwaway repositories, and the runner has none.
        run: |
          git config --global user.name 'sdd tests'
          git config --global user.email 'tests@example.invalid'
      - name: Run the tests
        # run.sh ends with its totals line and exits 0 on a skip. A skip here
        # means a prerequisite step above broke, so it fails the job.
        run: |
          bash tests/run.sh | tee "$RUNNER_TEMP/suite.log"
          totals=$(tail -n 1 "$RUNNER_TEMP/suite.log")
          if [[ ! $totals =~ ^[0-9]+\ ok,\ 0\ skipped,\ 0\ failed$ ]]; then
            echo "The totals line did not read '<n> ok, 0 skipped, 0 failed': $totals. A skip means a prerequisite step above broke; fix that step, never the test." >&2
            exit 1
          fi
      - name: Run shellcheck
        # The six bash scripts by name; section-span.awk is not shell.
        run: shellcheck bin/sdd-checkpoint skills/apply/scripts/openspec-section-brief skills/apply/scripts/openspec-section-tick skills/apply/scripts/run-archive skills/apply/scripts/sub-skill-check skills/apply/scripts/task-brief tests/*.sh
